name: v5
note: >
  V5 is a new phase. It does not overwrite the frozen confirmatory predictions.
  Hyperparameters below are fixed. They are not chosen on the pediatric
  structure-unseen slice.
eligible_endpoints:
  - ANY_OTHER_AE
  - ANY_SERIOUS
  - CARDIAC
  - DERMATOLOGIC
  - ENDOCRINE_METABOLIC
  - GASTROINTESTINAL
  - HEMATOLOGIC
  - IMMUNE_INFECTION
  - MORTALITY
  - NEUROLOGIC
  - PSYCHIATRIC
  - RESPIRATORY
permutation_seeds: [101, 202, 303, 404, 505]
neural_seeds: [0, 1, 2]
bootstrap_n: 1000
bootstrap_seed: 0
ridge_alpha: 10.0
weight_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
gate_intercept_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
gate_slope_grid: [-1.0, -0.5, 0.0, 0.5, 1.0]
adult_folds: 5
tox21_min_adult_observed: 30
mlp:
  hidden: 64
  epochs: 12
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
gnn:
  hidden: 32
  layers: 2
  epochs: 6
  lr: 0.001
outputs:
  cache: data/interim/v5
  results: results/v5
  report: reports/v5_results.md
